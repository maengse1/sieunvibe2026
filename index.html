<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>N빵 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 피자 제목 → 빨간 1인당 금액 밴드 → 좌(참석자 칩·항목 카드) / 우(정산 현황·송금 카드). 좁으면 한 줄로 쌓임 */
/* 색: 토마토 빨강(포인트·보낼 돈) / 치즈 노랑(강조·송금 카드) / 바질 초록(받을 돈) */
:root{
  --bg:#fbf5e8; --surface:#fffdf7; --ink:#2b1b14; --muted:#7a6759; --line:#ecdfc6;
  --tomato:#d63a2a; --cheese:#f2b632; --basil:#2f7d3b;
  --tomato-soft:#fde3dd; --cheese-soft:#fcefc4; --basil-soft:#ddf0dd;
  --tomato-ink:#a82618; --basil-ink:#1f5c29;
  --on-tomato:#ffffff; --on-cheese:#2b1b14; --on-basil:#ffffff;
  --hero-bg:#d63a2a; --hero-ink:#fff6df;
  --display:"Jua","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font:"Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1410; --surface:#2b1d17; --ink:#f8ede1; --muted:#c3ae9d; --line:#4a362c;
  --tomato:#ff6b55; --cheese:#ffc94d; --basil:#6fcf7f;
  --tomato-soft:#4a211b; --cheese-soft:#4a3a15; --basil-soft:#1d3a22;
  --tomato-ink:#ff9a8a; --basil-ink:#8fe09c;
  --on-tomato:#2a0d08; --on-cheese:#2b1b14; --on-basil:#0f2a14;
  --hero-bg:#a82b1c; --hero-ink:#fff6df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1410; --surface:#2b1d17; --ink:#f8ede1; --muted:#c3ae9d; --line:#4a362c;
  --tomato:#ff6b55; --cheese:#ffc94d; --basil:#6fcf7f;
  --tomato-soft:#4a211b; --cheese-soft:#4a3a15; --basil-soft:#1d3a22;
  --tomato-ink:#ff9a8a; --basil-ink:#8fe09c;
  --on-tomato:#2a0d08; --on-cheese:#2b1b14; --on-basil:#0f2a14;
  --hero-bg:#a82b1c; --hero-ink:#fff6df; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:16px}
#logo{flex:none;display:block;width:76px;height:76px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;margin:0;letter-spacing:-.01em}
h1 .nb{background:linear-gradient(transparent 58%,var(--cheese) 58%);color:var(--tomato-ink);padding:0 4px}
.lead{margin:4px 0 0;color:var(--muted);text-wrap:balance}

.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.hero .lab{font-size:14px;opacity:.9}
.hero .num{font-family:var(--display);font-size:56px;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.hero .chip{background:var(--cheese);color:var(--on-cheese);font-weight:700;border-radius:99px;padding:6px 14px;font-size:14px}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.cols{grid-template-columns:minmax(0,1fr)}
  .hero .num{font-size:44px} h1{font-size:32px} #logo{width:60px;height:60px}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sample{font-size:13px;color:var(--ink);background:var(--cheese-soft);border-radius:12px;padding:8px 12px}

.av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:13px}
.c0{background:var(--tomato);color:var(--on-tomato)} .c1{background:var(--cheese);color:var(--on-cheese)} .c2{background:var(--basil);color:var(--on-basil)}

.people{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:4px 6px 4px 5px}
.pchip:focus-within{border-color:var(--tomato)}
.pchip input{width:84px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:4px 2px}
.pchip input:focus{outline:none}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;cursor:pointer;border-radius:99px}
.x:hover{background:var(--tomato-soft);color:var(--tomato-ink)}
.addbtn{border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.addbtn:hover{border-color:var(--tomato);color:var(--tomato-ink)}

.items{display:flex;flex-direction:column;gap:12px}
.icard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.irow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iname{flex:1 1 140px;min-width:0;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:17px;padding:6px 2px}
.amt{flex:0 0 auto;display:flex;align-items:baseline;gap:4px;font-weight:700}
.amt input{width:112px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-family:var(--display);font-size:22px;text-align:right;padding:2px 2px;font-variant-numeric:tabular-nums}
.iname:focus,.amt input:focus{outline:none;border-bottom-color:var(--tomato)}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who .wl{font-size:12px;color:var(--muted);margin-right:2px}
.wp{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:3px 12px 3px 4px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.pick .av{width:22px;height:22px;font-size:11px}

.ctrl{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ctrl label{font-size:14px;display:flex;align-items:center;gap:8px}
select{border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:6px 10px}
button.big{font:inherit;font-family:var(--display);font-size:19px;border:0;border-radius:99px;background:var(--tomato);color:var(--on-tomato);padding:12px 24px;cursor:pointer}
button.big:hover{filter:brightness(1.07)}
:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
.iname:focus-visible,.amt input:focus-visible,.pchip input:focus-visible{outline:none}

.stat{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-variant-numeric:tabular-nums}
.srow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.badge{border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.b-get{background:var(--basil-soft);color:var(--basil-ink)}
.b-pay{background:var(--tomato-soft);color:var(--tomato-ink)}
.b-ok{background:var(--line);color:var(--muted)}

.moves{display:flex;flex-direction:column;gap:10px}
.mv{background:var(--cheese-soft);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mv .who2{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.mv svg{flex:none;width:28px;height:20px;color:var(--tomato-ink)}
.mv .amtv{margin-left:auto;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.none{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{font-size:14px;color:var(--basil-ink);font-weight:700;min-height:22px}
.pos{color:var(--basil-ink)} .neg{color:var(--tomato-ink)}
.doc{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
#docBody{display:flex;flex-direction:column;gap:20px}
.step{display:flex;flex-direction:column;gap:6px}
.step h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.step h3 .sic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--cheese-soft);color:var(--tomato-ink)}
.sic svg{width:18px;height:18px}
.dline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.dline .l{display:flex;gap:10px;align-items:center;min-width:0;overflow-wrap:anywhere}
.dline small{color:var(--muted)}
.eq{background:var(--cheese-soft);border-radius:14px;padding:12px 14px;font-family:var(--display);font-size:20px;overflow-wrap:anywhere}
.pvlab{font-size:13px;color:var(--muted)}
.pv{margin:0;background:var(--cheese-soft);color:var(--ink);border-radius:4px 18px 18px 18px;padding:14px 16px;font:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ttl{flex:1 1 220px;min-width:0;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:10px 18px}
.ttl:focus{outline:none;border-color:var(--tomato)}
.rb{display:inline-flex;gap:8px;align-items:center}
.bar .addbtn,.sv .addbtn{border-style:solid}
.addbtn.danger{color:var(--tomato-ink);border-color:var(--tomato)}
.bt{font-size:13px;color:var(--basil-ink);font-weight:700;flex-basis:100%;min-height:20px}
.dtitle{font-family:var(--display);font-size:20px}
.svlist{display:flex;flex-direction:column;gap:8px}
.sv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.sv .info{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;font-weight:700}
.sv small{display:block;color:var(--muted);font-weight:400}
@media (prefers-reduced-motion:no-preference){#logo{transition:transform .5s}#logo:hover{transform:rotate(45deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg id="logo" viewBox="0 0 100 100" role="img" aria-label="피자 그림"></svg>
    <div>
      <h1><span class="nb">N빵</span> 계산기</h1>
      <p class="lead">누가 무엇을 계산했는지만 적으면, 누가 누구에게 얼마를 보낼지 알려줘요.</p>
    </div>
  </header>

  <section class="bar" aria-label="모임 정보">
    <input id="title" class="ttl" type="text" maxlength="30" placeholder="모임 이름 (예: 11월 만화카페)" aria-label="모임 이름">
    <button type="button" class="addbtn" id="saveBtn">저장</button>
    <span class="rb" id="resetBox"></span>
    <span class="bt" id="barToast" aria-live="polite"></span>
  </section>

  <section class="hero" aria-live="polite" aria-label="1인당 금액">
    <div>
      <div class="lab">1인당 낼 금액</div>
      <div class="num" id="share">-</div>
    </div>
    <div class="chips"><span class="chip" id="chipTotal">-</span><span class="chip" id="chipN">-</span></div>
  </section>

  <div class="cols">
    <div class="col">
      <section class="sec" aria-label="참석자">
        <h2>같이 간 사람</h2>
        <div class="people" id="people"></div>
      </section>

      <section class="sec" aria-label="계산한 항목">
        <h2>계산한 것</h2>
        <div class="sample" id="sampleNote">표시된 항목과 금액은 예시예요. 직접 바꿔서 쓰세요.</div>
        <div class="items" id="items"></div>
        <div class="ctrl">
          <button type="button" class="addbtn" id="addI">+ 항목 추가</button>
        </div>
      </section>

      <section class="sec" aria-label="저장된 모임">
        <h2>저장된 모임</h2>
        <div id="saved"></div>
      </section>
    </div>

    <div class="col" aria-live="polite">
      <section class="sec" aria-label="사람별 현황">
        <h2>사람별 현황</h2>
        <div class="stat" id="stat"></div>
      </section>

      <section class="sec doc" id="doc" aria-label="계산 과정">
        <h2>계산 과정</h2>
        <div id="docBody"></div>
      </section>

      <section class="sec" aria-label="송금 목록">
        <h2>이렇게 보내면 끝</h2>
        <div class="moves" id="moves"></div>
        <p class="note" id="note"></p>
        <p class="note">계산 과정과 송금 목록을 캡처해서 단톡방에 올려도 돼요.</p>
        <div class="pvlab">단톡방에 이렇게 복사돼요</div>
        <pre class="pv" id="preview"></pre>
        <div class="row">
          <button type="button" class="big" id="copy">단톡방용 문구 복사</button>
          <span class="toast" id="toast"></span>
        </div>
      </section>
    </div>
  </div>

</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var won=function(n){return Math.round(n).toLocaleString('ko-KR')+'원'};
  var KEY='settle-up-v2';
  var S={
    title:'',sample:true,
    people:['민수','지연','현우','서아'],
    items:[{t:'입장료',a:40000,w:0},{t:'음료',a:18000,w:1},{t:'음식',a:26000,w:2}]
  };
  var text='';
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&Array.isArray(s.people)&&s.people.length>=2&&Array.isArray(s.items))S=s}catch(e){}
  if(typeof S.title!=='string')S.title='';
  function save(){
    if(S.sample){S.sample=false;var sn=document.getElementById('sampleNote');if(sn)sn.hidden=true}
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  }
  function nm(i){return (S.people[i]||'').trim()||('참석자'+(i+1))}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function av(i){return el('span','av c'+(i%3),Array.from(nm(i))[0])}

  /* 피자: 조각 수 = 참석자 수 */
  function pizza(n){
    var N=Math.max(2,Math.min(n,24)),C=50,svg='';
    svg+='<circle cx="50" cy="50" r="47" style="fill:var(--cheese)"/>';
    svg+='<circle cx="50" cy="50" r="39" style="fill:var(--tomato)"/>';
    for(var i=0;i<N;i++){
      var a=(i+0.5)/N*2*Math.PI-Math.PI/2;
      var px=C+Math.cos(a)*(N>10?24:24),py=C+Math.sin(a)*(N>10?24:24);
      svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(N>10?3:5.2)+'" style="fill:var(--hero-ink)" opacity=".92"/>';
      if(N<=10){
        var lx=C+Math.cos(a+0.28)*31,ly=C+Math.sin(a+0.28)*31;
        svg+='<ellipse cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" rx="3.4" ry="1.8" transform="rotate('+(((a+0.28)*180/Math.PI)+90).toFixed(0)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')" style="fill:var(--basil)"/>';
      }
    }
    for(var j=0;j<N;j++){
      var b=j/N*2*Math.PI-Math.PI/2;
      svg+='<line x1="50" y1="50" x2="'+(C+Math.cos(b)*52).toFixed(1)+'" y2="'+(C+Math.sin(b)*52).toFixed(1)+'" stroke-width="2.6" stroke-linecap="round" style="stroke:var(--bg)"/>';
    }
    $('logo').innerHTML=svg;
  }

  function drawPeople(){
    var box=$('people');box.innerHTML='';
    S.people.forEach(function(p,i){
      var chip=el('div','pchip');
      var a=av(i);
      var inp=el('input');inp.type='text';inp.id='n'+i;inp.value=p;inp.maxLength=10;inp.placeholder='이름';inp.setAttribute('aria-label','참석자 '+(i+1)+' 이름');
      inp.addEventListener('input',function(){
        S.people[i]=inp.value;save();a.textContent=Array.from(nm(i))[0];drawItems();calc();
      });
      var d=el('button','x','×');d.type='button';d.setAttribute('aria-label',nm(i)+' 삭제');
      d.addEventListener('click',function(){
        if(S.people.length<=2)return;
        S.people.splice(i,1);
        S.items.forEach(function(it){if(it.w===i)it.w=0;else if(it.w>i)it.w--});
        save();drawPeople();drawItems();calc();
      });
      chip.appendChild(a);chip.appendChild(inp);chip.appendChild(d);box.appendChild(chip);
    });
    var add=el('button','addbtn','+ 추가');add.type='button';
    add.addEventListener('click',function(){
      if(S.people.length>=20)return;
      S.people.push('');save();drawPeople();drawItems();calc();
      var e=$('n'+(S.people.length-1));if(e)e.focus();
    });
    box.appendChild(add);
  }

  function drawItems(){
    var box=$('items');box.innerHTML='';
    S.items.forEach(function(it,i){
      var card=el('div','icard');
      var row=el('div','irow');
      var t=el('input','iname');t.type='text';t.id='t'+i;t.value=it.t;t.maxLength=20;t.placeholder='항목 (예: 입장료)';t.setAttribute('aria-label','항목 이름 '+(i+1));
      var amt=el('div','amt');
      var a=el('input');a.type='number';a.id='a'+i;a.value=it.a||'';a.min=0;a.inputMode='numeric';a.placeholder='0';a.setAttribute('aria-label','금액 '+(i+1));
      amt.appendChild(a);amt.appendChild(el('span',null,'원'));
      var d=el('button','x','×');d.type='button';d.setAttribute('aria-label','항목 삭제');
      t.addEventListener('input',function(){S.items[i].t=t.value;save();calc()});
      a.addEventListener('input',function(){S.items[i].a=parseFloat(a.value)||0;save();calc()});
      d.addEventListener('click',function(){S.items.splice(i,1);save();drawItems();calc()});
      row.appendChild(t);row.appendChild(amt);row.appendChild(d);
      var who=el('div','who');who.appendChild(el('span','wl','계산한 사람'));
      var wp=el('div','wp');
      S.people.forEach(function(p,k){
        var b=el('button','pick');b.type='button';
        b.appendChild(av(k));b.appendChild(el('span',null,nm(k)));
        b.setAttribute('aria-pressed',it.w===k?'true':'false');
        b.addEventListener('click',function(){
          S.items[i].w=k;save();
          wp.querySelectorAll('.pick').forEach(function(x,j){x.setAttribute('aria-pressed',j===k?'true':'false')});
          calc();
        });
        wp.appendChild(b);
      });
      who.appendChild(wp);
      card.appendChild(row);card.appendChild(who);box.appendChild(card);
    });
    if(!S.items.length)box.appendChild(el('div','none','항목이 없어요. "+ 항목 추가"를 눌러 시작하세요.'));
  }

  /* 정산서: 계산 과정을 단계별로 보여줌 */
  function drawDoc(total,share,rem,extraNames,paid,owed,moves,n){
    var d=$('docBody');d.innerHTML='';
    if((S.title||'').trim())d.appendChild(el('div','dtitle',S.title.trim()));
    var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    var ICONS={
      '1':SV+'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
      '2':SV+'<path d="M5 12h14"/><circle cx="12" cy="6" r="1.3"/><circle cx="12" cy="18" r="1.3"/></svg>',
      '3':SV+'<path d="M12 4v16M7 20h10M4 8h16M4 8l-2.5 6a3.5 3.5 0 0 0 5 0zM20 8l-2.5 6a3.5 3.5 0 0 0 5 0z"/></svg>'
    };
    function step(no,title){var s=el('div','step');var h=el('h3');var ic=el('span','sic');ic.setAttribute('aria-hidden','true');ic.innerHTML=ICONS[no];h.appendChild(ic);h.appendChild(document.createTextNode(title));s.appendChild(h);d.appendChild(s);return s}
    var s1=step('1','누가 무엇을 계산했나');
    var any=false;
    S.items.forEach(function(it){
      var a=Math.round(it.a||0);
      if(!a&&!(it.t||'').trim())return;
      any=true;
      var line=el('div','dline'),l=el('div','l');
      var tx=el('div',null,(it.t||'').trim()||'항목');
      tx.appendChild(el('small',null,'  '+nm(it.w)+' 계산'));
      l.appendChild(tx);line.appendChild(l);line.appendChild(el('b',null,won(a)));s1.appendChild(line);
    });
    if(!any)s1.appendChild(el('div','none','항목을 입력하면 여기에 정리돼요.'));
    var tl=el('div','dline');tl.appendChild(el('b',null,'합계'));tl.appendChild(el('b',null,won(total)));s1.appendChild(tl);

    var s2=step('2','똑같이 나누기');
    s2.appendChild(el('div','eq',won(total)+' ÷ '+n+'명 = 1인당 '+won(share)+(rem>0?' (+1원)':'')));
    if(rem>0)s2.appendChild(el('p','note','딱 나누어 떨어지지 않아 '+extraNames.join(', ')+' 님이 1원씩 더 냅니다.'));

    var s3=step('3','사람별 계산');
    S.people.forEach(function(p,i){
      var diff=paid[i]-owed[i];
      var line=el('div','dline'),l=el('div','l');
      l.appendChild(av(i));
      l.appendChild(el('span',null,nm(i)+': 낸 돈 '+won(paid[i])+' − 내 몫 '+won(owed[i])));
      line.appendChild(l);
      line.appendChild(el('b',diff>0?'pos':(diff<0?'neg':null),(diff>0?'+':(diff<0?'−':''))+won(Math.abs(diff))+(diff>0?' 받음':(diff<0?' 보냄':' 정산 끝'))));
      s3.appendChild(line);
    });

  }

  var ARROW='<svg viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10h22M16 3l8 7-8 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function calc(){
    var n=S.people.length;
    pizza(n);
    var paid=S.people.map(function(){return 0});
    var total=0;
    S.items.forEach(function(it){var a=Math.round(it.a||0);total+=a;if(paid[it.w]!==undefined)paid[it.w]+=a});
    /* 1원 단위까지 정확히 나눔: 남는 몇 원은 먼저 적게 낸 사람부터 1원씩 더 부담 */
    var share=Math.floor(total/n),rem=total-share*n;
    var order=S.people.map(function(_,i){return i}).sort(function(a,b){return paid[a]-paid[b]||a-b});
    var owed=S.people.map(function(){return share});
    var extraNames=[];
    for(var q=0;q<rem;q++){owed[order[q]]+=1;extraNames.push(nm(order[q]))}
    $('share').textContent=won(share);
    $('chipTotal').textContent='총 '+won(total);
    $('chipN').textContent=n+'명';

    var stat=$('stat');stat.innerHTML='';
    var debtors=[],creditors=[];
    S.people.forEach(function(p,i){
      var diff=paid[i]-owed[i];
      var row=el('div','srow');
      row.appendChild(av(i));
      var name=el('div','nm',nm(i));
      name.appendChild(el('small',null,'계산한 돈 '+won(paid[i])));
      row.appendChild(name);
      var bd;
      if(diff>0){bd=el('span','badge b-get','받을 돈 '+won(diff));creditors.push({i:i,v:diff})}
      else if(diff<0){bd=el('span','badge b-pay','보낼 돈 '+won(-diff));debtors.push({i:i,v:-diff})}
      else bd=el('span','badge b-ok','정산 끝');
      row.appendChild(bd);stat.appendChild(row);
    });

    debtors.sort(function(a,b){return b.v-a.v});creditors.sort(function(a,b){return b.v-a.v});
    var moves=[],di=0,ci=0;
    while(di<debtors.length&&ci<creditors.length){
      var amt=Math.min(debtors[di].v,creditors[ci].v);
      if(amt>0)moves.push({f:debtors[di].i,t:creditors[ci].i,a:amt});
      debtors[di].v-=amt;creditors[ci].v-=amt;
      if(debtors[di].v<=0)di++;
      if(creditors[ci].v<=0)ci++;
    }
    var mv=$('moves');mv.innerHTML='';
    var lines=[];
    if(!moves.length)mv.appendChild(el('div','none','보낼 돈이 없어요. 항목과 금액을 입력하세요.'));
    moves.forEach(function(m){
      var card=el('div','mv');
      var f=el('span','who2');f.appendChild(av(m.f));f.appendChild(el('span',null,nm(m.f)));
      var ar=el('span');ar.innerHTML=ARROW;ar.style.display='inline-flex';
      var t=el('span','who2');t.appendChild(av(m.t));t.appendChild(el('span',null,nm(m.t)));
      card.appendChild(f);card.appendChild(ar);card.appendChild(t);
      card.appendChild(el('span','amtv',won(m.a)));
      mv.appendChild(card);
      lines.push(nm(m.f)+' → '+nm(m.t)+' '+won(m.a));
    });
    var remText=rem>0?('딱 나누어 떨어지지 않아 '+extraNames.join(', ')+' 님이 1원씩 더 냅니다.'):'';
    $('note').textContent=remText;
    drawDoc(total,share,rem,extraNames,paid,owed,moves,n);

    var det=S.items.filter(function(it){return (it.a||0)>0}).map(function(it){return '- '+((it.t||'').trim()||'항목')+' '+won(it.a)+' ('+nm(it.w)+')'});
    text=((S.title||'').trim()?'['+S.title.trim()+'] 정산':'[N빵 정산]')+' 총 '+won(total)+' / '+n+'명 / 1인당 '+won(share)+(rem>0?' (+'+extraNames.join(', ')+' 1원씩)':'')+'\n'+(det.length?det.join('\n')+'\n':'')+(lines.length?'\n'+lines.join('\n'):'\n보낼 돈 없음');
    $('preview').textContent=text;
  }

  function toast(m){$('toast').textContent=m;setTimeout(function(){if($('toast').textContent===m)$('toast').textContent=''},2500)}
  $('addI').addEventListener('click',function(){
    if(S.items.length>=40)return;
    S.items.push({t:'',a:0,w:0});save();drawItems();calc();
    var e=$('t'+(S.items.length-1));if(e)e.focus();
  });
  $('copy').addEventListener('click',function(){
    function fb(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'복사했어요.':'복사에 실패했어요. 결과를 직접 선택해 복사하세요.')}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('복사했어요.')},fb)}else fb();
  });

  /* 모임 제목 · 초기화 · 저장된 모임 */
  var LKEY='settle-up-saved',pendingDel=null;
  /* 브라우저 저장이 막혀 있어도 이 창을 열어 둔 동안은 목록이 동작하도록 메모리에도 보관 */
  var memList=[];
  function getList(){try{var l=JSON.parse(localStorage.getItem(LKEY)||'[]');return Array.isArray(l)?l:[]}catch(e){return memList.slice()}}
  function putList(l){memList=l.slice();try{localStorage.setItem(LKEY,JSON.stringify(l));return true}catch(e){return false}}
  function bt(m){var b=$('barToast');b.textContent=m;setTimeout(function(){if(b.textContent===m)b.textContent=''},3000)}
  function refreshAll(){$('title').value=S.title||'';$('sampleNote').hidden=!S.sample;drawPeople();drawItems();calc();renderSaved()}

  function renderReset(ask){
    var box=$('resetBox');box.innerHTML='';
    if(!ask){
      var b=el('button','addbtn','초기화');b.type='button';
      b.addEventListener('click',function(){renderReset(true)});
      box.appendChild(b);return;
    }
    box.appendChild(el('span','note','전부 지울까요?'));
    var ok=el('button','addbtn danger','지우기');ok.type='button';
    ok.addEventListener('click',function(){
      S={title:'',people:['',''],items:[],sample:false};
      save();refreshAll();renderReset(false);bt('초기화했어요.');
    });
    var no=el('button','addbtn','취소');no.type='button';
    no.addEventListener('click',function(){renderReset(false)});
    box.appendChild(ok);box.appendChild(no);
  }

  function renderSaved(){
    var box=$('saved');box.innerHTML='';
    var l=getList().filter(function(r){return r&&r.data&&Array.isArray(r.data.people)&&Array.isArray(r.data.items)});
    if(!l.length){box.appendChild(el('div','none','저장한 모임이 없어요. 위의 "저장" 버튼을 누르면 여기에 쌓여요.'));return}
    var wrap=el('div','svlist');
    l.forEach(function(r){
      var row=el('div','sv');
      var info=el('div','info',r.title);
      var tot=r.data.items.reduce(function(s,x){return s+Math.round(x.a||0)},0);
      info.appendChild(el('small',null,new Date(r.at).toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' 저장 · '+r.data.people.length+'명 · 총 '+won(tot)));
      row.appendChild(info);
      if(pendingDel===r.id){
        row.appendChild(el('span','note','삭제할까요?'));
        var y=el('button','addbtn danger','삭제');y.type='button';
        y.addEventListener('click',function(){putList(getList().filter(function(x){return !x||x.id!==r.id}));pendingDel=null;renderSaved()});
        var n=el('button','addbtn','취소');n.type='button';
        n.addEventListener('click',function(){pendingDel=null;renderSaved()});
        row.appendChild(y);row.appendChild(n);
      }else{
        var ld=el('button','addbtn','불러오기');ld.type='button';
        ld.addEventListener('click',function(){
          S={title:r.data.title||'',people:r.data.people.slice(),items:JSON.parse(JSON.stringify(r.data.items)),id:r.id,sample:false};
          save();refreshAll();renderReset(false);bt('불러왔어요.');window.scrollTo(0,0);
        });
        var dl=el('button','addbtn','삭제');dl.type='button';
        dl.addEventListener('click',function(){pendingDel=r.id;renderSaved()});
        row.appendChild(ld);row.appendChild(dl);
      }
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
  }

  $('title').addEventListener('input',function(){S.title=this.value;save();calc()});
  $('saveBtn').addEventListener('click',function(){
    var l=getList();
    var id=S.id||('m'+Date.now());S.id=id;
    var rec={id:id,title:(S.title||'').trim()||'제목 없는 모임',at:Date.now(),
      data:JSON.parse(JSON.stringify({title:S.title,people:S.people,items:S.items}))};
    var k=-1;l.forEach(function(x,j){if(x&&x.id===id)k=j});
    if(k>=0)l[k]=rec;else l.unshift(rec);
    if(l.length>30)l.length=30;
    var ok=putList(l);save();renderSaved();
    bt(ok?'저장했어요. 아래 "저장된 모임"에서 다시 불러올 수 있어요.':'이 화면에서는 브라우저 저장이 막혀 있어요. 이 창을 닫으면 목록이 사라져요. (시크릿 모드나 미리보기 창이면 그래요)');
  });

  refreshAll();renderReset(false);
})();
</script>
</body>
</html>
